# Loaded automatically by `docker compose up`. Bind-mounts the working tree and
# swaps gunicorn for runserver so edits reload without a rebuild.
#
# The bind-mount is also why the `tailwind` service below has to exist: it
# shadows /app in the image, so the stylesheet the Dockerfile's node stage
# compiled is invisible in dev. Something has to rebuild it on the host side,
# and this is it. (Issue #32 added it; before the Tailwind toolchain existed, a
# node service pointing at a missing theme/static_src broke `docker compose up`
# for everyone, which is why Layer 0 left it out.)

services:
  migrate:
    volumes:
      - .:/app

  app:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app

  tailwind:
    image: node:20-slim
    working_dir: /app
    # `npm ci` on start rather than a baked image: the lockfile is the source of
    # truth and this way a dependency bump needs no rebuild. It writes into the
    # named volume below, never the host tree.
    command: sh -c "npm ci --no-audit --no-fund && npm run watch:css"
    volumes:
      - .:/app
      # node_modules lives in a named volume so the container's linux binaries
      # (esbuild, @parcel/watcher and friends are platform-specific) never
      # clobber a macOS or Windows developer's host install.
      - tailwind_node_modules:/app/node_modules
    # Deliberately no depends_on and no healthcheck: a CSS watcher is not part
    # of the app's boot path, and `docker compose up -d` must not wait on or
    # fail because of it.
    #
    # And deliberately no restart policy. `npm ci` exits non-zero on a registry
    # blip or an out-of-sync lockfile, so `unless-stopped` would restart it
    # straight back into the same failing install — a tight loop hammering the
    # registry for as long as compose is up, in CI as well as on a laptop.
    # A watcher that died should stay dead and be read in the logs.

volumes:
  tailwind_node_modules:
