# Dependabot keeps the exact pins in requirements*.txt, package.json and the
# workflow action SHAs moving (SECURITY-BASELINE §10). The vulnerable fixture
# under tests/fixtures/ is deliberately not registered here: it is a CI
# self-test, not a dependency, and must stay on its vulnerable version.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "django-stubs"
          - "pytest*"
          - "pip-audit"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
