# Loaded automatically by `docker compose up`. Bind-mounts the working tree and
# swaps gunicorn for runserver so edits reload without a rebuild.
#
# The bind-mount is why the compiled bundles need handling here at all: `.:/app`
# shadows what the Dockerfile's node stage built into the image, so without the
# named volumes below a clean checkout serves the whole app unstyled — and the
# flow builder not at all — until, and only if, something rebuilds them.

services:
  migrate:
    volumes:
      - .:/app

  worker:
    volumes:
      - .:/app

  app:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      # Mounted over the hole the bind-mount above punches in the image.
      #
      # Docker seeds an empty named volume from the image's contents at that
      # path, and it does so even when a bind-mount covers the parent — so the
      # app serves the stylesheet baked at build time from its very first
      # request. That matters because `app` deliberately does not wait for the
      # watcher: if `npm ci` is slow, or the registry is unreachable, or the
      # watcher dies, the page stays styled instead of silently losing its CSS.
      - theme_css:/app/theme/static/css/dist
      # The same hole, the same patch, for the flow-builder island (issue #10).
      # It is gitignored too, so the bind-mount above replaces the copy the
      # `frontend` stage compiled with nothing at all — and the builder page
      # would show its "not built" notice while every other page looked fine,
      # which reads as a bug in the builder rather than as a missing volume.
      #
      # Because this volume shadows the bind-mount at that path, a host-side
      # rebuild cannot reach the container: whatever `npm run build:js` writes
      # into the checkout is hidden behind the volume's copy. The `builder`
      # service below is what writes into it, exactly as `tailwind` does for
      # the stylesheet.
      - builder_dist:/app/apps/flows/static/flows/builder

  # The island's watcher. It exists for the same reason the volume above does:
  # the named volume shadows the bind-mount, so a host-side `npm run watch:js`
  # writes somewhere the container cannot see. Only something writing from
  # inside reaches it.
  builder:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run watch:js"
    # `vite build --watch` keeps running without a TTY, but stdin closing on
    # `up -d` is what silently killed the Tailwind watcher, so it gets the same
    # treatment rather than a different failure mode to debug later.
    tty: true
    volumes:
      - .:/app
      # The volume the app reads, so a rebuild reaches it — and so the output
      # does not go through the host bind-mount. This container is root, and on
      # native Linux a bind-mounted write would leave root-owned files in the
      # checkout that a later host-side build cannot touch without sudo.
      - builder_dist:/app/apps/flows/static/flows/builder
      # Shared with `tailwind`: the container's linux binaries (esbuild,
      # rollup, lightningcss) must never clobber a macOS or Windows host
      # install, and one install serves both watchers.
      - tailwind_node_modules:/app/node_modules
    # Deliberately no depends_on, no healthcheck and no restart policy, for the
    # reasons spelled out on the tailwind service below.

  tailwind:
    image: node:24-slim
    working_dir: /app
    # `npm ci` on start rather than a baked image: the lockfile is the source of
    # truth and this way a dependency bump needs no rebuild. `watch:css` does an
    # initial build before it starts watching, so the seeded stylesheet is
    # replaced by a current one within seconds of `up`.
    command: sh -c "npm ci --no-audit --no-fund && npm run watch:css"
    # Without a TTY the Tailwind CLI's watcher sees stdin close the moment
    # `docker compose up -d` detaches and shuts itself down — it did its first
    # build and exited 0, so `up` looked entirely healthy while nothing was
    # actually watching and no edit ever rebuilt.
    tty: true
    volumes:
      - .:/app
      # The same volume the app reads, so a rebuild reaches it — and, just as
      # importantly, so the output does NOT go through the host bind-mount.
      # This container is root (node:24-slim has no non-root default), and on
      # native Linux a bind-mounted write would leave root-owned files in the
      # developer's checkout that a later host-side `npm run build:css` or a
      # plain `rm -rf` then cannot touch without sudo.
      - theme_css:/app/theme/static/css/dist
      # node_modules likewise: the container's linux binaries (esbuild,
      # @parcel/watcher) must never clobber a macOS or Windows host install.
      - tailwind_node_modules:/app/node_modules
    # Deliberately no depends_on and no healthcheck: a CSS watcher is not part
    # of the app's boot path, and `docker compose up -d` must not wait on or
    # fail because of it.
    #
    # And deliberately no restart policy. `npm ci` exits non-zero on a registry
    # blip or an out-of-sync lockfile, so `unless-stopped` would restart it
    # straight back into the same failing install — a tight loop hammering the
    # registry for as long as compose is up, in CI as well as on a laptop.
    # A watcher that died should stay dead and be read in the logs; the app is
    # still styled from the seeded bundle either way.

volumes:
  theme_css:
  builder_dist:
  tailwind_node_modules:
