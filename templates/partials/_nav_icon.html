{% comment %}
Feather-style 18px nav glyph. `name` comes from a NavItem.icon in
apps.common.context_processors; an unknown name renders a neutral dot rather
than nothing, so a mistyped key is visible instead of silently collapsing the
row's layout.
{% endcomment %}{% spaceless %}
<svg class="flex-shrink-0" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
