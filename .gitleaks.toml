# gitleaks v8 config. Extends the default rule set.
#
# Anything added to the allowlist must name the files, say what matches, and
# explain why it is not a credential.
#
# Why paths rather than inline `# gitleaks:allow` markers, which would be more
# precise: CI scans full history (fetch-depth: 0). An inline marker applies
# only to the commit that carries it, so every earlier commit of the same line
# still fails the scan. A path allowlist is the only form that holds across
# history.

[extend]
useDefault = true

# Fixtures deliberately shaped like credentials — Stripe keys, GitHub PATs,
# Slack tokens, AWS access-key ids, JWTs, and high-entropy strings standing in
# for a real secret so a negative case means something. They are the inputs
# that prove the log scrubber, the Sentry event scrubber and the placeholder
# checks actually fire; without them those tests assert nothing. All are
# literals in test parameters, never read from an environment, and grant
# access to nothing.
#
# Scoped to these three files and to the two rules they trip, so a real secret
# committed anywhere else — or a differently-shaped one here — still fails.
[[allowlists]]
description = "Synthetic credential-shaped test fixtures"
targetRules = ["generic-api-key", "stripe-access-token"]
paths = [
    '''apps/common/tests/test_logging\.py''',
    '''apps/common/tests/test_sentry\.py''',
    '''apps/common/tests/test_checks\.py''',
]

# Credential-shaped fixtures for the platform-credential store: fake client ids
# and secrets used to prove the encryption round trip, the masking helper, the
# admin-form corruption regression and the three-level resolution chain. All are
# literals in test files, grant access to nothing, and are the inputs that make
# those tests mean something.
[[allowlists]]
description = "Synthetic platform-credential test fixtures"
targetRules = ["generic-api-key"]
paths = [
    '''apps/credentials/tests/.*\.py''',
    '''tests/support\.py''',
]

# The email channel's credential-shaped fixtures (issue #21).
#
# `test_email_scrubbing.py` holds a Resend key, a Svix signing secret and an SES
# key pair shaped like the real things, because that file exists to prove the log
# scrubber's patterns fire — and a pattern written for a token shaped like a token
# proves nothing against a string shaped like "secret". It is the same argument
# `test_logging.py` is allowlisted under, one app over.
#
# The SNS fixture carries the confirmation `Token` AWS puts in a
# SubscriptionConfirmation payload: a long opaque string, and a recorded shape
# rather than a live one. It authorises confirming a subscription to a topic in
# an AWS account nobody owns.
#
# Both are literals in test files, never read from an environment, and grant
# access to nothing.
[[allowlists]]
description = "Synthetic email-provider test fixtures"
targetRules = ["generic-api-key"]
paths = [
    '''apps/channels/tests/test_email_scrubbing\.py''',
    '''apps/channels/tests/fixtures/email/.*\.json''',
]
