# Pre-commit hooks for BrightBean Chat.
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
# Reference: https://pre-commit.com

default_language_version:
  python: python3.12

repos:
  # Basic hygiene: trailing whitespace, EOF newlines, large files, merge conflicts, etc.
  #
  # The formatting hooks skip static/js/vendor/: those files are third-party
  # bundles copied verbatim out of node_modules by `npm run vendor`, and CI
  # re-runs that copy and diffs it. A hook that rewrote one would put the tree
  # in a state the vendor step can never reproduce, failing the build with no
  # way to satisfy both.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(static/js/vendor/|.*\.md$)
      - id: end-of-file-fixer
        exclude: ^static/js/vendor/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^static/js/vendor/

  # Ruff: lint + format (replaces black, isort, flake8, pyupgrade, bandit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy: static type checking for Python.
  #
  # Runs as a system hook against the installed dev environment rather than in
  # pre-commit's isolated venv. django-stubs' plugin loads
  # config.settings.test, which imports Django plus django-environ, django-csp
  # and cryptography — an isolated env holding only mypy and django-stubs fails
  # during plugin initialisation instead of type-checking anything. Listing
  # those runtime packages under additional_dependencies would work but would
  # duplicate pins that requirements.txt already owns, and they would drift.
  # `make setup` installs what this needs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^(apps|config|tests)/
        args: ["--ignore-missing-imports"]

  # gitleaks: block commits that contain secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Django: run Django's own system checks before pushing
  - repo: local
    hooks:
      - id: django-check
        name: django-check
        entry: python manage.py check
        language: system
        pass_filenames: false
        files: \.(py|html)$
        stages: [pre-push]
